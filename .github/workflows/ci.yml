name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Backend Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Run ESLint
        working-directory: backend
        run: npm run lint --if-present

      - name: Run Automated Unit & Concurrency Tests
        working-directory: backend
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/feedants_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_test_jwt_secret_token_12345
          RAZORPAY_KEY_ID: rzp_test_placeholder_key
          RAZORPAY_KEY_SECRET: rzp_test_placeholder_secret
          RAZORPAY_WEBHOOK_SECRET: ci_test_webhook_secret
        run: npm test --if-present

      - name: Test Docker Container Build
        working-directory: backend
        run: docker build -t feedants-arena-backend:ci .

  mobile-ci:
    name: Mobile Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Dependencies
        working-directory: mobile
        run: npm ci

      - name: Run ESLint Quality Check
        working-directory: mobile
        run: npm run lint --if-present
